<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Participante - Sistema de Atividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Painel do Participante</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item me-2">
                        <button id="btnMinhasInscricoes" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#modalMinhasInscricoes">
                            Minhas Inscrições
                        </button>
                    </li>
                    <li class="nav-item">
                        <button id="btnSair" class="btn btn-danger">Sair</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm p-4 mb-4 bg-white rounded">
            <h2 class="mb-3 text-primary">Atividades Disponíveis</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Nome da Atividade</th>
                            <th>Total Vagas</th>
                            <th>Vagas Disponíveis</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAtividade">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalMinhasInscricoes" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Atividades em que estou cadastrado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Nome da Atividade</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaMinhasInscricoes">
                            </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="../../Modulo B/Arquivo_JS/PARTICIPANTE LOGADO/participanteLogado.js"></script>
</body>
</html>
