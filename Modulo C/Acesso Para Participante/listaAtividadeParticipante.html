<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Viva - Painel do Participante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-pagina-customizada">

    <!-- Cabeçalho unificado idêntico ao resto do site com logo e botões de ação -->
    <div class="container-fluid bg-black px-4">
        <div class="container">
            <header class="header-customizado">
                <div class="d-flex align-items-center">
                    <a href="homeLogado.html" class="d-inline-flex link-body-emphasis text-decoration-none">
                        <img id="logoHeader" src="../Imagem/Logo só imagem sem fundo.png" alt="Festival Viva">
                    </a>
                </div>
                
                <div class="d-flex align-items-center gap-2">
                    <button id="btnMinhasInscricoes" class="btn btn-outline-light btn-sm px-3" data-bs-toggle="modal" data-bs-target="#modalMinhasInscricoes">
                        Minhas Inscrições
                    </button>
                    <button id="btnSair" class="btn btn-danger btn-sm px-3">
                        Sair
                    </button>
                </div>
            </header>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="container my-5">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h2 class="mb-4 text-dark fw-bold h3">Atividades Disponíveis</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="py-3 ps-4">Nome da Atividade</th>
                            <th>Total Vagas</th>
                            <th>Vagas Disponíveis</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAtividade">
                        <!-- Preenchido dinamicamente pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Minhas Inscrições -->
    <div class="modal fade" id="modalMinhasInscricoes" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Atividades em que estou cadastrado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="py-3 ps-3">Nome da Atividade</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaMinhasInscricoes">
                                <!-- Preenchido dinamicamente pelo JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../Modulo B/Arquivo_JS/PARTICIPANTE LOGADO/participanteLogado.js"></script>
</body>
</html>
