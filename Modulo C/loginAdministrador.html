<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Festiva Viva - Login Administrador</title>
</head>
<body>

    <div class="container mt-5" style="max-width: 400px;">
        <h2 class="mb-4 text-center">Login do Administrador</h2>
        
        <form id="formLoginAdmin">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="usuario" required>
            </div>
            
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required>
            </div>

            <!-- Mensagem de Erro -->
            <div id="msgErro" class="text-danger mb-3 fw-bold"></div>

            <button type="submit" id="btnConfirmarLogin" class="btn btn-dark w-100">Entrar como Administrador</button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Importante: type="module" para o script carregar os imports corretamente -->
    <script type="module" src="../Modulo B/Arquivo_JS/loginAdministrativo.js"></script>
</body>
</html>
