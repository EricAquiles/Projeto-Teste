<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Festiva Viva - Cadastro</title>
</head>
<body>

    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4 text-center">Cadastro de Participante</h2>
        
        <!-- Formulário de cadastro -->
        <form id="participante">
            <div class="mb-3">
                <label for="nomeParticipante" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nomeParticipante" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>
    </div>

    <!-- POP-UP DE CONFIRMAÇÃO PÓS-CADASTRO (Aparece após o cadastro dar certo) -->
    <div class="modal fade" id="modalConfirmarInscricao" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-3">
                <div class="modal-body">
                    <p class="fs-5 mb-4">Cadastro realizado com sucesso! Deseja confirmar sua inscrição nesta atividade?</p>
                    <button id="btnConfirmarInscricaoSim" class="btn btn-success px-4 me-2">Sim</button>
                    <button id="btnConfirmarInscricaoNao" class="btn btn-secondary px-4">Não</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts necessários -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- Arquivo JS específico para a lógica de cadastro -->
    <script type="module" src="gerenciamentoCadastro.js"></script>
</body>
</html>
