<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Versão do Bootstrap padronizada para 5.3.8 sem integrity para evitar bloqueios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Festival Viva - Gerenciar Inscrições</title>
</head>
<body class="bg-light">

    <!-- Menu de Navegação Administrativo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Festival Viva - Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="adminParticipante.html">Participantes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="adminAtividade.html">Atividades</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="adminInscricoes.html">Inscrições</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="../Interface Sem Acesso/home.html">Sair</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h2 class="mb-4">Painel Administrativo - Consulta de Inscrições</h2>

        <!-- Card de Filtros -->
        <div class="card shadow-sm p-4 mb-4">
            <h4 class="mb-3">Filtrar Inscrições</h4>
            
            <!-- Escolha do Tipo de Filtro (Rádio) -->
            <div class="mb-3">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipoFiltro" id="filtroAtividade" value="atividade" checked>
                    <label class="form-check-label" for="filtroAtividade">Por Atividade</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipoFiltro" id="filtroParticipante" value="participante">
                    <label class="form-check-label" for="filtroParticipante">Por E-mail do Participante</label>
                </div>
            </div>

            <!-- GRUPO 1: Select de Atividades (Visível por padrão) -->
            <div id="grupoAtividade" class="mb-3">
                <label for="selectAtividades" class="form-label">Selecione a Atividade</label>
                <select id="selectAtividades" class="form-select">
                    <!-- Preenchido via JavaScript -->
                </select>
            </div>

            <!-- GRUPO 2: Input de E-mail (Começa escondido) -->
            <div id="grupoParticipante" class="mb-3" style="display: none;">
                <label for="inputEmail" class="form-label">E-mail do Participante</label>
                <input type="email" id="inputEmail" class="form-control" placeholder="Digite o e-mail...">
            </div>

            <button id="btnPesquisar" class="btn btn-primary px-4">Pesquisar</button>
        </div>

        <!-- TABELA DE RESULTADOS -->
        <div class="card shadow-sm p-4">
            <h4 class="mb-3">Resultados da Consulta</h4>
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Nome do Participante</th>
                        <th>E-mail</th>
                        <th>Atividade Inscrita</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyInscricoes">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../Modulo B/Arquivo_JS/ADMINISTRATIVO/inscricoes.js"></script>
</body>
</html>
